<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111312">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BunkerStock">
    <title>BunkerStock — Logistics &amp; Expiry Control</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #111312;
            color: #EAEFEA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        #bunker-cam {
            position: fixed;
            display: none;
            object-fit: cover;
            background: #0A0C0B;
            z-index: 1;
            pointer-events: none;
        }
        #compose-root {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: env(safe-area-inset-left, 0px);
            z-index: 2;
        }
        #compose-root canvas {
            background: transparent !important;
        }
        #bunker-loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #111312;
            color: #EAEFEA;
            transition: opacity 220ms ease;
        }
        #bunker-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-ring {
            width: 36px;
            height: 36px;
            border: 3px solid #2D332E;
            border-top-color: #22C55E;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }
        .loader-title {
            font-weight: 800;
            letter-spacing: 0.08em;
            font-size: 15px;
        }
        .loader-title span {
            color: #4ADE80;
        }
        .loader-sub {
            font-size: 12px;
            color: #9AA39C;
            text-align: center;
            max-width: 280px;
            line-height: 1.4;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <video id="bunker-cam" autoplay playsinline muted></video>
    <div id="compose-root"></div>
    <div id="bunker-loader">
        <img src="icon.svg" alt="BunkerStock" width="52" height="52">
        <div class="loader-title">BUNKER<span>STOCK</span></div>
        <div class="loader-ring"></div>
        <div class="loader-sub" id="bunker-loader-msg">Loading WebAssembly runtime…</div>
    </div>

    <script>
        // Detect missing WasmGC early (e.g. Safari < 18.2 on older iOS) so users get a clear message instead of hanging
        (function checkWasmGc() {
            try {
                // Minimal WasmGC module declaring an empty struct type (section 1, len 3, count 1, struct 0x5f, 0 fields)
                const bytes = new Uint8Array([0,97,115,109,1,0,0,0,1,3,1,95,0]);
                if (typeof WebAssembly === 'undefined' || !WebAssembly.validate(bytes)) {
                    const msg = document.getElementById('bunker-loader-msg');
                    if (msg) {
                        msg.textContent = 'This browser does not support WebAssembly GC (requires iOS 18.2+ Safari, Chrome, or Firefox).';
                    }
                }
            } catch (_) {}
        })();

        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
    <script src="qr-encoder.js"></script>
    <script src="bunker-web-bridge.js"></script>
    <script src="bunkerstockWeb.js"></script>
</body>
</html>
