name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode persistent signing keystore
        if: secrets.SIGNING_KEY_BASE64 != ''
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "${RUNNER_TEMP}/bunkerstock.jks"
          echo "SIGNING_STORE_FILE=${RUNNER_TEMP}/bunkerstock.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Signed Release APK
        env:
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: gradle assembleRelease --stacktrace

      - name: Upload Signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunkerStock-v2.6-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "BunkerStock-${TAG}.apk"
          gh release create "$TAG" "BunkerStock-${TAG}.apk" \
            --title "BúnkerStock ${TAG}" \
            --notes "BúnkerStock ${TAG}: firma persistente para actualizaciones automáticas sin desinstalar, estética búnker con textura granulada mate y esquinas tácticas mecanizadas, escáner ML Kit + popup inferior no bloqueante, puntuación nutricional YsiFoods y caducidad GS1/estimada." \
            || gh release upload "$TAG" "BunkerStock-${TAG}.apk" --clobber
